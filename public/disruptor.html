<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>嚴厲老師 vs 疲憊學生｜干擾同學</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/disruptor.css">
    <link rel="stylesheet" type="text/css" href="css/ui.css">
</head>

<body>
    <div class="container-fluid background">
        <div class="tvs-phone-wrap">
            <div class="row" style="margin: 4vh;"></div>
            <div class="row align-items-center">
                <div class="col-12">
                    <h4 style="color: white;">冷卻時間</h4>
                </div>
                <div class="col-12">
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped" role="progressbar" style="width: 0%"
                            aria-valuenow="10" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>

            </div>
            <div class="row my-3 align-items-start">
                <div class="col-6 tvs-action-col">
                    <img id="right" src="img/1711.png" alt="丟粉筆">
                    <h5 class="tvs-action-label">丟粉筆</h5>
                </div>
                <div class="col-6 tvs-action-col">
                    <img id="left" src="img/1731.png" alt="看飛碟">
                    <h5 class="tvs-action-label">看飛碟</h5>
                </div>
            </div>
        </div>

    </div>

    <!-- 大廳（加入房間 / 準備）覆蓋層 -->
    <div id="lobby_overlay" class="tvs-overlay">
        <div class="tvs-overlay-card">
            <h2 id="lobby_room" class="tvs-room-code">教室號碼：----</h2>
            <p id="lobby_info">正在加入房間…</p>
            <button id="btn_ready" class="tvs-btn" style="display: none;">準備</button>
            <button id="btn_tutorial" class="tvs-btn tvs-btn-ghost" type="button">玩法教學</button>
            <a class="tvs-btn tvs-btn-ghost" href="index.html">回首頁</a>
        </div>
    </div>

    <!-- 玩法教學（單頁說明卡） -->
    <div id="tutorial_overlay" class="tvs-overlay tvs-overlay-front" style="display: none;">
        <div class="tvs-overlay-card tvs-tut-card">
            <p class="tvs-tut-text">有夠壞的你，在課堂中干擾老師，讓你的同學不能好好睡覺！</p>
            <div class="tvs-tut-row">
                <img src="img/1711.png" class="tvs-tut-chalk" alt="丟粉筆">
                <div>
                    <h5>丟粉筆事件</h5>
                    <p class="tvs-tut-text">選擇方向對講台丟擲粉筆。</br>老師軟Q的身體會左右閃躲。可能成功閃避繼續講課，也可能被丟中而氣得跳腳！</p>
                </div>
            </div>
            <div class="tvs-tut-row">
                <img src="img/1731.png" class="tvs-tut-ufo" alt="看飛碟">
                <div>
                    <h5>飛碟事件</h5>
                    <p class="tvs-tut-text">大喊“有飛碟”，對外星人很有研究的老師會跑去窗邊查看！</br>如果老師一時興起，會跟學生介紹外星人的故事喔！</p>
                </div>
            </div>
            <p class="tvs-tut-note">留意事件發動有 20 秒鐘的冷卻時間，看準時機干擾！</p>
            <button id="tut_close" class="tvs-btn" type="button">關閉教學</button>
        </div>
    </div>

    <!-- 丟粉筆：選擇丟擲方向 -->
    <div id="dir_overlay" class="tvs-overlay" style="display: none;">
        <div class="tvs-overlay-card">
            <h2>丟粉筆</h2>
            <p>選擇丟擲方向，賭老師往哪邊閃！</p>
            <div class="row">
                <div class="col-6 tvs-action-col">
                    <img id="dir_left" class="tvs-dir-img" src="img/dodge_left.png" alt="丟向左邊">
                    <h5 class="tvs-dir-label">丟左邊</h5>
                </div>
                <div class="col-6 tvs-action-col">
                    <img id="dir_right" class="tvs-dir-img" src="img/dodge_right.png" alt="丟向右邊">
                    <h5 class="tvs-dir-label">丟右邊</h5>
                </div>
            </div>
            <button id="dir_cancel" class="tvs-btn tvs-btn-ghost">取消</button>
        </div>
    </div>

    <!-- 結算覆蓋層 -->
    <div id="result_overlay" class="tvs-overlay" style="display: none;">
        <div class="tvs-overlay-card">
            <h2 id="result_title">結果</h2>
            <p id="result_detail"></p>
            <a class="tvs-btn" href="index.html">回首頁</a>
            <a class="tvs-btn tvs-btn-ghost" href="leaderboard.html">看排行榜</a>
        </div>
    </div>

    <div id="net_banner" class="tvs-net-banner" style="display: none;"></div>
    <div id="ready_go" class="tvs-readygo" style="display: none;"><span>準 備</span></div>

    <script src="js/vendor/socket.io.min.js"></script>
    <script type="module" src="js/disruptor.js"></script>
</body>

</html>
