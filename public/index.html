<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>老師 vs 學生｜課堂打瞌睡大作戰</title>
    <link rel="stylesheet" type="text/css" href="css/ui.css">
</head>

<body class="tvs-home">
    <div class="tvs-home-card">
        <div class="tvs-home-heroes">
            <img class="tvs-home-hero tvs-hero-flip" src="img/IMG_0166.png" alt="生氣的老師">
            <img class="tvs-home-hero" src="img/IMG_0188.png" alt="打瞌睡的學生">
        </div>
        <h1 class="tvs-home-title">老師 vs 學生</h1>
        <p class="tvs-home-subtitle">課堂打瞌睡大作戰</p>

        <label class="tvs-label tvs-student-only" for="player_name">你的名字</label>
        <input id="player_name" class="tvs-input tvs-student-only" type="text" maxlength="20" placeholder="請輸入姓名">

        <div class="tvs-menu">
            <button id="btn_single" class="tvs-btn tvs-student-only" disabled>單人模式</button>
            <button id="btn_create" class="tvs-btn tvs-student-only" disabled>雙人模式</button>
            <a id="btn_board" class="tvs-btn tvs-btn-ghost tvs-disabled" href="leaderboard.html">排行榜</a>
        </div>

        <div class="tvs-divider tvs-student-only"><span>我是干擾同學？</span></div>
        <p class="tvs-mobile-note">遊戲需要較大的畫面，請改用電腦開啟本頁。<br>要以干擾者身份加入同學的房間，請點下方入口。</p>
        <a id="btn_join" class="tvs-btn tvs-btn-join" href="join.html">干擾同學入口</a>

        <p class="tvs-hint">
            玩法：上課偷睡覺賺分數，老師轉身前要醒來！<br>
            雙人模式：以「干擾者同學身分」加入遊戲，<br>
            輸入教室號碼就能丟粉筆、放飛碟進行干擾 😈
        </p>
    </div>

    <script type="module" src="js/home.js"></script>
</body>

</html>
