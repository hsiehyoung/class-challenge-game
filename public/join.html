<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>嚴厲老師 vs 疲憊學生｜干擾同學入口</title>
    <link rel="stylesheet" type="text/css" href="css/ui.css">
</head>

<body class="tvs-home">
    <div class="tvs-home-card">
        <img class="tvs-home-hero" src="img/IMG_0248.png" alt="干擾同學">
        <h1 class="tvs-home-title">干擾同學入口</h1>
        <p class="tvs-home-subtitle">輸入教室號碼加入遊戲，開始搗蛋 😈</p>

        <label class="tvs-label" for="player_name">你的名字</label>
        <input id="player_name" class="tvs-input" type="text" maxlength="20" placeholder="請輸入姓名">

        <label class="tvs-label" for="room_code">教室號碼（請學生提供 4 碼）</label>
        <input id="room_code" class="tvs-input tvs-input-code" type="text" maxlength="4"
            placeholder="ABCD" autocomplete="off" autocapitalize="characters">

        <div class="tvs-menu">
            <button id="btn_join_go" class="tvs-btn" disabled>加入房間</button>
            <a class="tvs-btn tvs-btn-ghost" href="index.html">← 回首頁</a>
        </div>

        <p class="tvs-hint">
            玩法：進入教室後按「準備」，上課時透過丟粉筆、放飛碟干擾老師！<br>
            讓同學不能好好補眠！要注意每次干擾有 20 秒冷卻時間。
        </p>
    </div>

    <script type="module" src="js/join.js"></script>
</body>

</html>
